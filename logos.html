<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Action 88 — ACTION Font Options</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Orbitron:wght@900&family=Audiowide&family=Racing+Sans+One&family=Bungee&family=Michroma&display=swap" rel="stylesheet">
<style>
  body { margin:0; font-family:system-ui, sans-serif; background:#0b0616; color:#eee; text-align:center; }
  h1 { padding:32px 16px 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:24px; max-width:1150px; margin:0 auto; padding:24px; }
  .card { background:#140a24; border-radius:16px; padding:20px; }
  svg { width:100%; height:auto; max-width:360px; }
  .o { paint-order:stroke; stroke:#0b0616; stroke-linejoin:round; }
  h2 { font-size:1.1rem; margin:12px 0 4px; }
</style>
</head>
<body>
<h1>Action 88 — "ACTION" Font Options</h1>
<div class="grid" id="grid"></div>

<script>
const fonts = [
  { name: "1. Orbitron",        family: "Orbitron",           size: 40, weight: 900 },
  { name: "2. Audiowide",       family: "Audiowide",          size: 44, weight: 400 },
  { name: "3. Racing Sans One", family: "'Racing Sans One'",  size: 54, weight: 400 },
  { name: "4. Bungee",          family: "Bungee",             size: 42, weight: 400 },
  { name: "5. Michroma",        family: "Michroma",           size: 34, weight: 400 }
];

const grid = document.getElementById("grid");
fonts.forEach((f, i) => {
  grid.innerHTML += `
  <div class="card">
    <svg viewBox="0 0 360 220">
      <defs>
        <linearGradient id="hot${i}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff2e88"/>
        </linearGradient>
      </defs>
      <text class="o" x="180" y="70" font-family="${f.family}" font-size="${f.size}" font-weight="${f.weight}"
            fill="#fff" stroke-width="7" text-anchor="middle" letter-spacing="4">ACTION</text>
      <g transform="skewX(-12) translate(25,0)" font-family="'Russo One', sans-serif" text-anchor="middle">
        <text x="150" y="190" font-size="110" fill="#00e5ff" opacity=".15">88</text>
        <text x="165" y="190" font-size="110" fill="#00e5ff" opacity=".3">88</text>
        <text x="180" y="190" font-size="110" fill="#00e5ff" opacity=".5">88</text>
        <text class="o" x="195" y="190" font-size="110" fill="url(#hot${i})" stroke-width="8">88</text>
      </g>
    </svg>
    <h2>${f.name}</h2>
  </div>`;
});
</script>
</body>
</html>
