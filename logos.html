<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Action 88 — Retro Logo Ideas</title>
<style>
  body { margin:0; font-family:system-ui, sans-serif; background:#0b0616; color:#eee; text-align:center; }
  h1 { padding:32px 16px 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:24px; max-width:1150px; margin:0 auto; padding:24px; }
  .card { background:#140a24; border-radius:16px; padding:24px; }
  svg { width:100%; height:auto; max-width:360px; }
  h2 { font-size:1.1rem; margin:12px 0 4px; }
  p { color:#9a8fb0; margin:0; font-size:.9rem; }
</style>
</head>
<body>
<h1>Action 88 — Retro Ideas</h1>
<div class="grid">

  <!-- A. Sunset stacked -->
  <div class="card">
    <svg viewBox="0 0 360 240">
      <defs>
        <linearGradient id="sunA" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff2e88"/>
        </linearGradient>
      </defs>
      <circle cx="180" cy="100" r="80" fill="url(#sunA)"/>
      <g fill="#140a24">
        <rect x="100" y="112" width="160" height="5"/>
        <rect x="100" y="128" width="160" height="7"/>
        <rect x="100" y="146" width="160" height="10"/>
      </g>
      <text x="180" y="105" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#fff" stroke="#00e5ff" stroke-width="2" text-anchor="middle" letter-spacing="4">ACTION</text>
      <text x="180" y="225" font-family="system-ui, sans-serif" font-size="56" font-weight="900" fill="#00e5ff" text-anchor="middle" letter-spacing="10">88</text>
    </svg>
    <h2>A. Sunset Stacked</h2>
    <p>"ACTION" across the sun, with a big neon 88 underneath.</p>
  </div>

  <!-- B. Wide banner with grid -->
  <div class="card">
    <svg viewBox="0 0 360 240">
      <defs>
        <linearGradient id="sunB" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff2e88"/>
        </linearGradient>
        <linearGradient id="txtB" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#9ff6ff"/><stop offset="1" stop-color="#ff2e88"/>
        </linearGradient>
      </defs>
      <circle cx="180" cy="120" r="70" fill="url(#sunB)"/>
      <rect x="0" y="140" width="360" height="100" fill="#140a24"/>
      <g stroke="#ff2e88" stroke-width="2" opacity=".8">
        <line x1="0" y1="150" x2="360" y2="150"/><line x1="0" y1="168" x2="360" y2="168"/>
        <line x1="0" y1="192" x2="360" y2="192"/><line x1="0" y1="224" x2="360" y2="224"/>
        <line x1="180" y1="140" x2="180" y2="240"/><line x1="180" y1="140" x2="60" y2="240"/>
        <line x1="180" y1="140" x2="300" y2="240"/><line x1="180" y1="140" x2="-40" y2="240"/>
        <line x1="180" y1="140" x2="400" y2="240"/>
      </g>
      <text x="180" y="150" font-family="Impact, system-ui, sans-serif" font-size="62" font-style="italic" fill="url(#txtB)" stroke="#00e5ff" stroke-width="1.5" text-anchor="middle" letter-spacing="2">ACTION 88</text>
    </svg>
    <h2>B. Neon Horizon</h2>
    <p>"ACTION 88" on one line over a sunset and a glowing grid floor.</p>
  </div>

  <!-- C. Round badge -->
  <div class="card">
    <svg viewBox="0 0 360 240">
      <defs>
        <linearGradient id="sunC" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff2e88"/>
        </linearGradient>
        <clipPath id="clipC"><circle cx="180" cy="120" r="100"/></clipPath>
      </defs>
      <circle cx="180" cy="120" r="108" fill="none" stroke="#00e5ff" stroke-width="5"/>
      <g clip-path="url(#clipC)">
        <rect x="70" y="10" width="220" height="220" fill="#1d0f38"/>
        <circle cx="180" cy="135" r="62" fill="url(#sunC)"/>
        <g fill="#1d0f38">
          <rect x="110" y="140" width="140" height="5"/>
          <rect x="110" y="154" width="140" height="7"/>
          <rect x="110" y="170" width="140" height="10"/>
        </g>
      </g>
      <text x="180" y="78" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="6">ACTION</text>
      <text x="180" y="150" font-family="system-ui, sans-serif" font-size="70" font-weight="900" fill="#fff" stroke="#00e5ff" stroke-width="2.5" text-anchor="middle">88</text>
    </svg>
    <h2>C. Arcade Badge</h2>
    <p>A round badge, good for an app icon or a sticker.</p>
  </div>

</div>
</body>
</html>
