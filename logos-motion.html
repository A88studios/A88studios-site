<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Action 88 — Animated Logo</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Racing+Sans+One&display=swap" rel="stylesheet">
<style>
  body { margin:0; height:100vh; overflow:hidden; background:#000; display:flex; justify-content:center; align-items:center; font-family:system-ui, sans-serif; }
  .car { width:90vw; max-width:600px; animation: drive 4.5s infinite; }
  svg { width:100%; height:auto; overflow:visible; }
  .o { paint-order:stroke; stroke:#000; stroke-linejoin:round; }
  .trail { animation: trail 4.5s infinite; }

  /* roll in slow -> stop -> rev shake -> pull back -> launch off screen */
  @keyframes drive {
    0%   { transform: translateX(-130vw); animation-timing-function: cubic-bezier(.2,.7,.3,1); }
    30%  { transform: translateX(0); }
    36%  { transform: translateX(-4px) rotate(-.6deg); }
    40%  { transform: translateX(4px)  rotate(.6deg); }
    44%  { transform: translateX(-4px) rotate(-.6deg); }
    48%  { transform: translateX(5px)  rotate(.8deg); }
    52%  { transform: translateX(-5px) rotate(-.8deg); }
    56%  { transform: translateX(0)    rotate(0); }
    62%  { transform: translateX(-30px) skewX(6deg); animation-timing-function: cubic-bezier(.6,0,1,.4); }
    76%  { transform: translateX(160vw) skewX(-20deg) scaleX(1.3); }
    100% { transform: translateX(160vw); }
  }

  /* trails: fade while cruising in, flicker on the rev, stretch big on launch */
  @keyframes trail {
    0%   { opacity:.8; transform: translateX(-10px); }
    30%  { opacity:0;  transform: translateX(0); }
    38%  { opacity:.9; transform: translateX(-8px); }
    42%  { opacity:.2; }
    46%  { opacity:1;  transform: translateX(-12px); }
    50%  { opacity:.3; }
    56%  { opacity:1;  transform: translateX(-16px); }
    62%  { opacity:1;  transform: translateX(-10px); }
    70%  { opacity:1;  transform: translateX(-90px) scaleX(1.6); }
    76%  { opacity:1;  transform: translateX(-140px) scaleX(2); }
    100% { opacity:0; }
  }

  button { position:fixed; bottom:20px; background:#ff3b3b; color:#fff; border:none; border-radius:999px; padding:10px 22px; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>
  <div class="car" id="car">
    <svg viewBox="0 0 360 220">
      <defs>
        <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff3b3b"/><stop offset="1" stop-color="#b3001b"/>
        </linearGradient>
      </defs>

      <!-- ACTION -->
      <g transform="skewX(-12) translate(20,0)" font-family="'Racing Sans One', sans-serif" text-anchor="middle" letter-spacing="4">
        <g class="trail">
          <text x="156" y="92" font-size="54" fill="#ff8a00" opacity=".15">ACTION</text>
          <text x="164" y="92" font-size="54" fill="#ff8a00" opacity=".3">ACTION</text>
          <text x="172" y="92" font-size="54" fill="#ff8a00" opacity=".5">ACTION</text>
        </g>
        <text class="o" x="180" y="92" font-size="54" fill="#fff" stroke-width="7">ACTION</text>
      </g>

      <!-- 88 -->
      <g transform="skewX(-12) translate(25,0)" font-family="'Russo One', sans-serif" text-anchor="middle">
        <g class="trail">
          <text x="150" y="190" font-size="110" fill="#ff8a00" opacity=".15">88</text>
          <text x="165" y="190" font-size="110" fill="#ff8a00" opacity=".3">88</text>
          <text x="180" y="190" font-size="110" fill="#ff8a00" opacity=".5">88</text>
        </g>
        <text class="o" x="195" y="190" font-size="110" fill="url(#red)" stroke-width="8">88</text>
      </g>
    </svg>
  </div>

  <button onclick="pause()" id="btn">Pause</button>

<script>
  let paused = false;
  function pause() {
    paused = !paused;
    document.querySelectorAll('.car, .trail').forEach(el =>
      el.style.animationPlayState = paused ? 'paused' : 'running');
    document.getElementById('btn').textContent = paused ? 'Play' : 'Pause';
  }
</script>
</body>
</html>
